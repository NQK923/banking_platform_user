name: Flutter

on:
  push:
    paths:
      - "**"
      - ".github/workflows/flutter.yml"
  pull_request:
    paths:
      - "**"
      - ".github/workflows/flutter.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
